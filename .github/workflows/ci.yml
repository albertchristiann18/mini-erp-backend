name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  PYTHONUNBUFFERED: "1"
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Ruff import order
        run: uv run ruff check . --select I --diff
      - name: Ruff format
        run: uv run ruff format . --check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy . --config-file mypy.ini
        env:
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}

  pytest:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install libpq-dev
        run: sudo apt-get update && sudo apt-get install -y libpq-dev gcc
      - run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest
        env:
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432